name: Flutter checks

on:
  push:
    branches: [taskflow]
  pull_request:
    branches: [taskflow]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
